services:
  - type: web
    name: vypar-sathi-api
    runtime: python
    plan: free
    rootDir: vyaparsaathi-city
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: VYAPAR_EXTERNAL_APIS_ENABLED
        value: 'false'
      - key: VYAPAR_OBSERVATIONS_ENABLED
        value: 'false'
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: VYAPAR_DB_PATH
        value: /tmp/vyaparsaathi.sqlite3
