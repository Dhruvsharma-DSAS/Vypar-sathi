name: daily-data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    if: ${{ vars.VYAPAR_EXTERNAL_APIS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/daily_mandi.py
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      - run: python scripts/daily_news.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          mkdir -p app/public/data/daily
          cp data/daily/*.json app/public/data/daily/
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/daily app/public/data/daily
          git commit -m "daily data update" || echo "nothing to commit"
          git push
